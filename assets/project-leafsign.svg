<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="一叶签（LeafSign）：开源的 Android 每日签到工具">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4bd8"/>
      <stop offset="0.55" stop-color="#5468ee"/>
      <stop offset="1" stop-color="#8c5bef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbe5"/>
      <stop offset="1" stop-color="#5fe39a"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="240" rx="16"/></clipPath>
    <path id="leafShape" d="M0 -60 C 42 -38, 52 12, 0 60 C -52 12, -42 -38, 0 -60 Z"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="600" height="240" fill="url(#bg)"/>
    <rect width="600" height="240" fill="url(#glow)"/>
    <g fill="#ffffff" fill-opacity="0.08">
      <use href="#leafShape" transform="translate(290 40) rotate(40) scale(0.7)"/>
      <use href="#leafShape" transform="translate(250 215) rotate(-30) scale(0.9)"/>
      <use href="#leafShape" transform="translate(590 20) rotate(120) scale(0.8)"/>
    </g>

    <!-- 图标与标题 -->
    <g transform="translate(58 84) rotate(32) scale(0.62)">
      <use href="#leafShape" fill="url(#leaf)"/>
      <path d="M-20 4 L-5 20 L22 -16" fill="none" stroke="#2f3bb0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-32)"/>
    </g>
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#ffffff">
      <text x="100" y="100" font-size="44" font-weight="700">一叶签</text>
      <text x="34" y="146" font-size="17" fill="#ffffff">扫码登录，一键完成每日签到</text>
      <text x="34" y="172" font-size="13" letter-spacing="1.5" fill="#dde3ff">LeafSign · Android · 开源</text>
    </g>

    <!-- 签到清单：五个平台 -->
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
      <rect x="346" y="26" width="226" height="188" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <g stroke="#ffffff" stroke-opacity="0.14">
        <line x1="362" y1="63" x2="556" y2="63"/>
        <line x1="362" y1="100" x2="556" y2="100"/>
        <line x1="362" y1="137" x2="556" y2="137"/>
        <line x1="362" y1="174" x2="556" y2="174"/>
      </g>
      <circle cx="368" cy="45" r="5" fill="#f87171"/>
      <circle cx="368" cy="82" r="5" fill="#60a5fa"/>
      <circle cx="368" cy="119" r="5" fill="#fbbf24"/>
      <circle cx="368" cy="156" r="5" fill="#f9a8d4"/>
      <circle cx="368" cy="193" r="5" fill="#e5e7eb"/>
      <g font-size="14" fill="#ffffff">
        <text x="384" y="50">网易云音乐</text>
        <text x="384" y="87">百度贴吧</text>
        <text x="384" y="124">森空岛</text>
        <text x="384" y="161">哔哩哔哩</text>
        <text x="384" y="198">小黑盒</text>
      </g>
      <g>
        <g transform="translate(546 45)">
          <circle r="10" fill="url(#tick)"/>
          <path d="M-5 0 L-1.5 4 L5 -4" fill="none" stroke="#2f3bb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="10" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="10;17" dur="2.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(546 82)">
          <circle r="10" fill="url(#tick)"/>
          <path d="M-5 0 L-1.5 4 L5 -4" fill="none" stroke="#2f3bb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="10" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="10;17" dur="2.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(546 119)">
          <circle r="10" fill="url(#tick)"/>
          <path d="M-5 0 L-1.5 4 L5 -4" fill="none" stroke="#2f3bb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="10" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="10;17" dur="2.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(546 156)">
          <circle r="10" fill="url(#tick)"/>
          <path d="M-5 0 L-1.5 4 L5 -4" fill="none" stroke="#2f3bb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="10" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="10;17" dur="2.8s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(546 193)">
          <circle r="10" fill="url(#tick)"/>
          <path d="M-5 0 L-1.5 4 L5 -4" fill="none" stroke="#2f3bb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="10" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="10;17" dur="2.8s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
        </g>
      </g>
    </g>
  </g>
</svg>
