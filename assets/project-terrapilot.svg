<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="TerraPilot：Terraria Boss 战斗 AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1647"/>
      <stop offset="1" stop-color="#0d3b4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9be7ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="clip"><rect width="600" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="600" height="240" fill="url(#bg)"/>
    <rect width="600" height="240" fill="url(#grid)"/>
    <rect width="600" height="240" fill="url(#glow)"/>

    <!-- AI 视角示意 -->
    <g transform="translate(-150 28) scale(0.64)">
      <line x1="1060" y1="132" x2="930" y2="322" stroke="#ff5d8f" stroke-width="22" stroke-linecap="round" stroke-opacity="0.22">
        <animate attributeName="stroke-opacity" values="0.14;0.3;0.14" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="1060" y1="132" x2="930" y2="322" stroke="#ff8fb1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
      <rect x="1004" y="40" width="124" height="92" rx="6" fill="#ff5d8f" fill-opacity="0.08" stroke="#ff5d8f" stroke-width="1.8" stroke-dasharray="6 5"/>
      <g fill="#ffb020" fill-opacity="0.16" stroke="#ffb020" stroke-width="1.8">
        <circle cx="770" cy="150" r="14"/>
        <circle cx="850" cy="108" r="16"/>
        <circle cx="934" cy="172" r="13"/>
        <circle cx="800" cy="62" r="11"/>
        <circle cx="700" cy="100" r="12"/>
        <circle cx="906" cy="58" r="10"/>
        <circle cx="842" cy="190" r="12"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.4">
        <path d="M700 232 Q 668 214 640 184"/>
        <path d="M700 232 Q 676 262 654 292"/>
        <path d="M700 232 Q 728 276 764 300"/>
        <path d="M700 232 Q 740 226 778 204"/>
        <path d="M700 232 Q 716 198 722 166"/>
      </g>
      <path d="M700 232 C 740 264, 790 270, 830 252 S 870 224, 892 212" fill="none" stroke="#5ee6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7">
        <animate attributeName="stroke-dashoffset" values="30;0" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <circle cx="892" cy="212" r="4.5" fill="#5ee6ff"/>
      <circle cx="700" cy="232" r="17" fill="none" stroke="#5ee6ff" stroke-opacity="0.45" stroke-width="1.8">
        <animate attributeName="r" values="13;21;13" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="232" r="8" fill="#5ee6ff"/>
    </g>

    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
      <text x="32" y="62" font-size="12" letter-spacing="2.5" fill="#9be7ff" fill-opacity="0.85">TERRARIA · TMODLOADER</text>
      <text x="30" y="112" font-size="44" font-weight="700" fill="url(#title)">TerraPilot</text>
      <text x="32" y="146" font-size="17" fill="#d6dcff">通用 Boss 战斗 AI</text>
    </g>
  </g>
</svg>
