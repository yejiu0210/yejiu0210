<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="葉玖 (yejiu0210)：喜欢折腾游戏模组和自动化小工具">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbe5"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="20"/></clipPath>
    <path id="leafShape" d="M0 -60 C 42 -38, 52 12, 0 60 C -52 12, -42 -38, 0 -60 Z"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>

    <!-- 星点 -->
    <g fill="#ffffff">
      <circle cx="520" cy="46" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="92" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="38" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="70" r="1.3"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="34" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="110" r="1.2"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="250" r="1.3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="210" r="1.1"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 飘动的叶子 -->
    <g>
      <g transform="translate(980 150)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="6s" repeatCount="indefinite"/>
          <use href="#leafShape" fill="url(#leaf)" fill-opacity="0.95" transform="rotate(32) scale(1.5)"/>
          <path d="M0 -78 L0 78" stroke="#0b5d4b" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" transform="rotate(32)"/>
        </g>
      </g>
      <g transform="translate(1100 220)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; -6 8; 0 0" dur="7.5s" repeatCount="indefinite"/>
          <use href="#leafShape" fill="#34d399" fill-opacity="0.35" transform="rotate(-28) scale(0.8)"/>
        </g>
      </g>
      <g transform="translate(850 80)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 8 6; 0 0" dur="8s" repeatCount="indefinite"/>
          <use href="#leafShape" fill="#fbbf24" fill-opacity="0.35" transform="rotate(70) scale(0.55)"/>
        </g>
      </g>
      <g transform="translate(820 240)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 5 -7; 0 0" dur="6.8s" repeatCount="indefinite"/>
          <use href="#leafShape" fill="#ffffff" fill-opacity="0.12" transform="rotate(-60) scale(0.7)"/>
        </g>
      </g>
      <use href="#leafShape" fill="#ffffff" fill-opacity="0.05" transform="translate(1180 40) rotate(120) scale(1.4)"/>
      <use href="#leafShape" fill="#ffffff" fill-opacity="0.05" transform="translate(30 290) rotate(15) scale(1.5)"/>
    </g>

    <!-- 文字 -->
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
      <text x="64" y="84" font-size="15" letter-spacing="4" fill="#a7f3d0" fill-opacity="0.9">HELLO, I'M</text>
      <text x="60" y="166" font-size="84" font-weight="700" fill="url(#name)">葉玖</text>
      <text x="246" y="166" font-size="26" fill="#c7d2fe" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">@yejiu0210</text>
      <text x="64" y="218" font-size="23" fill="#e5e7eb">喜欢折腾游戏模组和自动化小工具</text>

      <g font-size="14" text-anchor="middle">
        <g fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22">
          <rect x="64" y="238" width="96" height="30" rx="15"/>
          <rect x="170" y="238" width="96" height="30" rx="15"/>
          <rect x="276" y="238" width="96" height="30" rx="15"/>
          <rect x="382" y="238" width="96" height="30" rx="15"/>
        </g>
        <g fill="#ffffff">
          <text x="112" y="258">游戏 AI</text>
          <text x="218" y="258">模组开发</text>
          <text x="324" y="258">Android</text>
          <text x="430" y="258">自动化</text>
        </g>
      </g>
    </g>
  </g>
</svg>
